<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">NepaliCode — programming in Nepali</title>
  <desc id="desc">A dark developer-themed banner featuring NepaliCode, a programming language from Nepal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#162b42"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc143c"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1410" cy="80" r="240" fill="#dc143c" opacity=".08"/>
  <circle cx="1250" cy="650" r="320" fill="#2ea043" opacity=".06"/>
  <path d="M0 610 C260 500 430 680 700 580 S1170 420 1600 560 L1600 720 L0 720Z" fill="#0b1220" opacity=".55"/>
  <g filter="url(#shadow)">
    <rect x="108" y="112" width="1384" height="496" rx="24" fill="#0d1117" stroke="#334155" stroke-width="2"/>
    <rect x="108" y="112" width="1384" height="54" rx="24" fill="#171f2d"/>
    <circle cx="142" cy="139" r="8" fill="#ff5f56"/><circle cx="170" cy="139" r="8" fill="#ffbd2e"/><circle cx="198" cy="139" r="8" fill="#27c93f"/>
    <text x="238" y="146" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">nepalicode — showcase</text>
    <text x="184" y="285" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="78" font-weight="800">NepaliCode</text>
    <rect x="184" y="316" width="210" height="8" rx="4" fill="url(#accent)"/>
    <text x="184" y="382" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="32">A modern programming language from Nepal.</text>
    <text x="184" y="430" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="25">Simple syntax • Nepali keywords • Unicode • Bytecode VM</text>
    <text x="184" y="515" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">kaam greet(name):</text>
    <text x="184" y="552" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">    print(f"Namaste {name}!")</text>
    <text x="1288" y="285" fill="#dc143c" font-size="130">न</text>
    <text x="1288" y="410" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">PROGRAMMING</text>
    <text x="1288" y="448" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="27">IN NEPALI</text>
  </g>
</svg>
